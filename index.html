    <!-- Non-blocking font load: fetch the stylesheet without blocking the

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap"

    <!--
      Google Analytics (GA4)
      -----------------------
      1. Create a GA4 property at https://analytics.google.com → Admin → Create Property.
      2. Add a Web data stream for https://www.giospatial.org — this gives you a
         Measurement ID shaped like G-XXXXXXXXXX.
      3. Replace BOTH occurrences of "G-XXXXXXXXXX" below with that ID.
      4. Deploy. Traffic shows up in Realtime within minutes; standard reports
         populate within 24–48h.
      This snippet fires on every route change automatically because RouteSEO.tsx
      already calls gtag('config', ...) with the SPA's virtual pageview on each
      client-side navigation — no extra wiring needed once the ID is set.
    -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-XXXXXXXXXX');
    </script>
